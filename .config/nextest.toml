# cargo-nextest settings (https://nexte.st/docs/configuration/).

# The workflows run with NEXTEST_PROFILE=ci: one run reports every failing
# test, where a local `just check` keeps the default and stops at the first.
# A test still running after 5 minutes is ended and fails, so a hang costs
# minutes rather than the job's whole timeout. The slowest test takes about
# a minute (59 s, a Docker install test on Ubuntu).
[profile.ci]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

# The tests that measure time or build large workspaces run alone, with no
# other test beside them, so another test's load is not counted in their
# limits. `MEASURING` in tests/session_start.rs keeps them apart only within
# one process, as `cargo test` runs them; nextest runs each test in its own
# process. On a 3-core CI runner, a hook that starts in 6 ms on its own took
# 27 to 140 ms beside other tests. Overrides in the default profile apply to
# every profile. Their times print on success too, so every run shows them.
# tests/ci.rs checks that this lists exactly the tests that take MEASURING.
[[profile.default.overrides]]
filter = """
binary(session_start) & (
    test(=twenty_listed_repositories_are_read_well_within_the_prompt_limit)
    | test(=a_large_workspace_lists_global_and_folder_memories_whole_and_shares_the_rest)
    | test(=a_folder_of_many_repositories_names_twenty_and_counts_the_rest)
    | test(=a_tool_the_hook_does_not_act_on_is_passed_over_at_once)
)"""
threads-required = "num-test-threads"
success-output = "final"
