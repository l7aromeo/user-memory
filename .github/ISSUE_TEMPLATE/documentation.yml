name: Documentation
description: Something in the docs is wrong, unclear or missing
labels: [documentation]
body:
  - type: input
    id: location
    attributes:
      label: Where
      description: The page and section, or a link to it.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong, unclear or missing
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
