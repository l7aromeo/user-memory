name: Feature request
description: Propose something user-memory does not do yet
labels: [enhancement]
body:
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Before you file
      options:
        - label: I searched the existing issues and found nothing matching
          required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and where user-memory falls short today.
    validations:
      required: true

  - type: textarea
    id: scenarios
    attributes:
      label: Scenarios
      description: The concrete cases it must handle, such as the commands, the agent's request or the setup.

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to get the same result, including what you do today.

  - type: checkboxes
    id: compatibility
    attributes:
      label: Compatibility
      description: Check what it would change. Each needs an upgrade note, and a change to stored data a tested migration.
      options:
        - label: A CLI command or flag
        - label: An MCP tool, parameter or result field
        - label: The store format
        - label: Files on disk, such as the instruction files or the hooks
