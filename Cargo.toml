[package]
name = "user-memory"
version = "0.9.3"
edition = "2024"
description = "Typed user memory and grounded patterns for adaptable agents via local or remote MCP"
license = "MIT OR Apache-2.0"
repository = "https://github.com/l7aromeo/user-memory"
publish = false

# The fake command-line programs the tests put on PATH (tests/fake/cli.rs).
# Releases build only `--bin user-memory`, so it never ships.
[[bin]]
name = "user-memory-fake"
path = "tests/fake/cli.rs"
test = false
doc = false

# The delivery benchmark's entry into the matcher (evals/delivery/entry.rs),
# which no shipped command calls yet. Releases build only `--bin
# user-memory`, so it never ships; its tests run the matcher's unit tests.
[[bin]]
name = "user-memory-bench"
path = "evals/delivery/entry.rs"
doc = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rmcp = { version = "3", features = ["server", "client", "macros", "schemars", "transport-io", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
schemars = { version = "1", features = ["uuid1"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "process", "io-util", "io-std", "sync"] }
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
rand = "0.9"
subtle = "2"
dunce = "1.0.5"
rust-stemmers = "1.2"
# SHA-256 for the instruction files' write records; rustls already builds it.
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys"] }
# The delivery index's build hashes its terms with it (src/memory/delivery.rs);
# serde_json and rusqlite already build it.
foldhash = { version = "0.2", default-features = false }

# serve's stdin reader, which waits for input with poll before each read,
# so no read is under way when serve hands over by exec (src/handover.rs).
[target."cfg(unix)".dependencies]
rustix = { version = "1", features = ["event"] }

# The owner-only ACL and the PATH broadcast (src/platform/windows.rs), and
# the user PATH in the registry.
[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
windows-registry = "0.100.0"

[dev-dependencies]
# The docs test reads the strings in src/ as Rust tokens, so it can leave
# test code out (tests/docs.rs).
proc-macro2 = "1"
# The completeness test of the option floors reads the tools' input structs
# from the source (src/setup/versions.rs); the docs test unescapes strings.
syn = { version = "2", features = ["full"] }
tempfile = "3"
yaml-rust2 = { version = "0.13", default-features = false }

[lints.clippy]
unwrap_used = "deny"

# Builds for cargo-mutants (.cargo/mutants.toml): the test profile without
# debug information, which cargo-mutants rebuilds for every mutant.
[profile.mutants]
inherits = "test"
debug = "none"
