# The installer's Docker server is this project too: one container,
# user-memory-memory-1, whatever this checkout's folder is called.
name: user-memory
services:
  memory:
    build: .
    image: user-memory:local
    restart: unless-stopped
    init: true
    stop_signal: SIGINT
    stop_grace_period: 15s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      # A string test runs through the container's shell (same as CMD-SHELL).
      test: "USER_MEMORY_URL=http://127.0.0.1:8765/mcp USER_MEMORY_TOKEN_FILE=/data/access-token user-memory index >/dev/null"
      interval: 30s
      timeout: 25s
      start_period: 20s
      retries: 3
    environment:
      USER_MEMORY_EMBED_URL: ${USER_MEMORY_EMBED_URL:-}
      USER_MEMORY_EMBED_MODEL: ${USER_MEMORY_EMBED_MODEL:-}
      USER_MEMORY_EMBED_DIMENSIONS: ${USER_MEMORY_EMBED_DIMENSIONS:-}
      USER_MEMORY_EMBED_QUERY_INSTRUCTION: ${USER_MEMORY_EMBED_QUERY_INSTRUCTION:-}
      USER_MEMORY_EMBED_API_KEY_FILE: ${USER_MEMORY_EMBED_API_KEY_FILE:-}
      USER_MEMORY_EMBED_ALLOW_HTTP: ${USER_MEMORY_EMBED_ALLOW_HTTP:-}
    ports:
      - "${MEMORY_BIND_IP:-127.0.0.1}:${MEMORY_PORT:-8765}:8765"
    volumes:
      - memory-data:/data
    command:
      - host
      - --listen
      - 0.0.0.0:8765
      - --db
      - /data/memories.sqlite3
      - --token-file
      - /data/access-token
      - --allowed-host
      - "${MEMORY_HOST:-localhost}"
      - --allowed-host
      - "${MEMORY_BIND_IP:-127.0.0.1}"

  # Optional local embedding model for semantic recall. Started only with the
  # "embeddings" profile; reachable only on the compose network (no published port).
  ollama:
    image: ollama/ollama:0.40.4
    profiles: [embeddings]
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    volumes:
      - ollama-models:/root/.ollama

volumes:
  ollama-models:
    name: "${OLLAMA_VOLUME_NAME:-user-memory-ollama-models}"
  memory-data:
    name: "${MEMORY_VOLUME_NAME:-user-memory-data}"
